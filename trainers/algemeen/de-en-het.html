<div class="container">
  <div class="topbar">
    <span class="eyebrow">Trainers · algemeen</span>
    <h1>De of het — quiz</h1>
    <p>Тест на знання нідерландських артиклів · всі рівні, вибір самостійний</p>
  </div>

    <div class="stat"><div class="stat-value" id="score">0</div><div class="stat-label">Бали</div></div>
    <div class="stat"><div class="stat-value" id="question-num">1</div><div class="stat-label">Питання</div></div>
    <div class="stat"><div class="stat-value" id="accuracy">0%</div><div class="stat-label">Точність</div></div>
    <div class="stat"><div class="stat-value streak" id="streak">🔥 <span id="streak-count">0</span></div><div class="stat-label">Серія</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="start-screen" id="start-screen">
    <h2>Оберіть рівень складності</h2>
    <div class="level-select">
      <button class="level-btn active" data-level="all">Всі рівні</button>
      <button class="level-btn" data-level="1">Рівень 1 (Базовий)</button>
      <button class="level-btn" data-level="2">Рівень 2 (Середній)</button>
      <button class="level-btn" data-level="3">Рівень 3 (Складний)</button>
    </div>
    <button class="start-btn" onclick="startGame()">Почати гру</button>
  </div>

  <div class="game-area hidden" id="game-area">
    <div class="word-display">
      <div class="word-card">
        <div class="dutch-word" id="current-word">woord</div>
        <div class="translation" id="translation">переклад</div>
        <span class="level-badge" id="level-badge">Рівень 1</span>
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="buttons">
      <button class="btn btn-de" onclick="checkAnswer('de')" id="btn-de">DE</button>
      <button class="btn btn-het" onclick="checkAnswer('het')" id="btn-het">HET</button>
    </div>
    <div class="hint-box" id="hint-box"><strong>Підказка:</strong> <span id="hint-text"></span></div>
  </div>

  <div class="end-screen hidden" id="end-screen">
    <h2>🎉 Гру завершено!</h2>
    <div style="font-family:'Poppins',Arial,sans-serif; font-size:2.4em; color:var(--blue-deep); margin:16px 0; font-weight:700;">

    </div>
    <p style="font-size:1.05em; color:var(--text-muted); margin-bottom:24px;">Точність: <strong id="final-accuracy">0%</strong></p>
    <div id="performance-message" style="margin-bottom:24px; font-size:1.05em;"></div>
    <button class="start-btn" onclick="restartGame()">Грати знову</button>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <button class="control-btn" onclick="showHint()">💡 Підказка</button>
    <button class="control-btn" onclick="skipQuestion()">⏭ Пропустити</button>
    <button class="control-btn" onclick="endGame()">🏁 Завершити</button>
  </div>

  <footer>Trainers/algemeen · NT2-programma</footer>
</div>

    let maxStreak = 0;
    let answered = false;
    let gameStats = { correct: 0, total: 0, byLevel: {1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}} };

    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentLevel = this.dataset.level;
        });
    });

    function startGame() {
        if (currentLevel === 'all') {
            currentWords = [...words].sort(() => Math.random() - 0.5);
        } else {
            currentWords = words.filter(w => w.level == currentLevel).sort(() => Math.random() - 0.5);
        }
        if (currentWords.length === 0) { alert('Немає слів для цього рівня!'); return; }
        currentIndex = 0; score = 0; streak = 0;
        gameStats = { correct: 0, total: 0, byLevel: {1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}} };
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('controls').style.display = 'flex';
        updateStats(); showWord();
    }

    function showWord() {
        if (currentIndex >= currentWords.length) { endGame(); return; }
        const word = currentWords[currentIndex];
        document.getElementById('current-word').textContent = word.word;
        document.getElementById('translation').textContent = word.translation;
        document.getElementById('level-badge').textContent = 'Рівень ' + word.level;
        document.getElementById('hint-text').textContent = word.hint;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('hint-box').classList.remove('show');
        document.getElementById('btn-de').disabled = false;
        document.getElementById('btn-het').disabled = false;
        answered = false;
        updateProgress();
    }

    function checkAnswer(answer) {
        if (answered) return;
        answered = true;
        const word = currentWords[currentIndex];
        const correct = answer === word.article;
        document.getElementById('btn-de').disabled = true;
        document.getElementById('btn-het').disabled = true;
        gameStats.total++; gameStats.byLevel[word.level].total++;
        if (correct) {
            score += 10 + (streak * 2); streak++;
            if (streak > maxStreak) maxStreak = streak;
            gameStats.correct++; gameStats.byLevel[word.level].correct++;
            showFeedback(true, `✅ Правильно! ${word.article} ${word.word}`);
        } else {
            streak = 0;
            showFeedback(false, `❌ Неправильно! Правильна відповідь: ${word.article} ${word.word}`);
        }
        updateStats();
        setTimeout(() => { currentIndex++; showWord(); }, 2000);
    }

    function showFeedback(isCorrect, message) {
        const feedback = document.getElementById('feedback');
        feedback.textContent = message;
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.style.display = 'block';
    }

    function showHint() {
        document.getElementById('hint-box').classList.add('show');
        score = Math.max(0, score - 2);
        updateStats();
    }

    function skipQuestion() {
        if (answered) return;
        streak = 0;
        const word = currentWords[currentIndex];
        showFeedback(false, `⏭ Пропущено: ${word.article} ${word.word}`);
        gameStats.total++; gameStats.byLevel[word.level].total++;
        answered = true;
        updateStats();
        setTimeout(() => { currentIndex++; showWord(); }, 2000);
    }

    function updateStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('question-num').textContent = Math.min(currentIndex + 1, currentWords.length);
        document.getElementById('streak-count').textContent = streak;
        const accuracy = gameStats.total > 0 ? Math.round((gameStats.correct / gameStats.total) * 100) : 0;
        document.getElementById('accuracy').textContent = accuracy + '%';
    }

    function updateProgress() {
        const progress = ((currentIndex) / currentWords.length) * 100;
        document.getElementById('progress').style.width = progress + '%';
    }

    function endGame() {
        document.getElementById('game-area').classList.add('hidden');
        document.getElementById('controls').style.display = 'none';
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
        document.getElementById('total-questions').textContent = gameStats.total;
        const accuracy = gameStats.total > 0 ? Math.round((gameStats.correct / gameStats.total) * 100) : 0;
        document.getElementById('final-accuracy').textContent = accuracy + '%';
        let message = '';
        if (accuracy >= 90) message = '🏆 Відмінно! Ти експерт з артиклів!';
        else if (accuracy >= 70) message = '👍 Добре! Але ще є над чим працювати.';
        else if (accuracy >= 50) message = '📚 Непогано! Продовжуй вчитися.';
        else message = '💪 Не здавайся! Практика робить майстра.';
        if (maxStreak >= 10) message += '<br>🔥 Найдовша серія: ' + maxStreak + '!';
        document.getElementById('performance-message').innerHTML = message;
    }

    function restartGame() {
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('game-area').classList.contains('hidden')) return;
        if (e.key === 'd' || e.key === 'D') checkAnswer('de');
        if (e.key === 'h' || e.key === 'H') checkAnswer('het');
        if (e.key === 'ArrowRight') skipQuestion();
        if (e.key === '?') showHint();
    });
</script>
</body>
</html>
